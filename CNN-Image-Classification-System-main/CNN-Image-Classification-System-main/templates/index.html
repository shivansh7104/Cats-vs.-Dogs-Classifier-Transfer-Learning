<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cats vs Dogs Classifier</title>
    <link href="fonts.googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="light">

<div class="container">
    <div class="header">
        <h2>🐱 Cats vs Dogs Classifier 🐶</h2>
        <p>Upload an image to see if it's a cat or a dog!</p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="upload-form">
        <input type="file" name="file" required class="file-input">
        <button type="submit" class="predict-btn">Predict</button>
    </form>

    {% if prediction %}
        <div class="result">{{ prediction }}</div>
    {% endif %}
    
    <button id="theme-toggle" class="theme-toggle-btn">Toggle Theme</button>
</div>

<script>
    const toggleBtn = document.getElementById("theme-toggle");
    const body = document.body;

    if (body.classList.contains("light")) {
        toggleBtn.textContent = "Switch to Dark Mode";
    } else {
        toggleBtn.textContent = "Switch to Light Mode";
    }

    toggleBtn.addEventListener("click", () => {
        if(body.classList.contains("light")){
            body.classList.remove("light");
            body.classList.add("dark");
            toggleBtn.textContent = "Switch to Light Mode";
        } else {
            body.classList.remove("dark");
            body.classList.add("light");
            toggleBtn.textContent = "Switch to Dark Mode";
        }
    });
</script>

</body>
</html>
